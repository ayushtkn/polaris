# Security scans for GitHub Actions workflow files. Container image scanning
# lives in ci.yml (docker-image-scan) because it depends on the built image.

name: Security

on:
  pull_request:
    branches: [ "main", "release/*", "feature/*" ]
  push:
    branches: [ "main", "release/*", "feature/*" ]
  schedule:
    - cron: '16 4 * * 1'

permissions:
  contents: read

env:
  # What zizmor-action v0.6.2 resolves "latest" to, pinned so a release cannot shift CI silently.
  ZIZMOR_VERSION: "1.29.0"

jobs:
  zizmor:
    name: Zizmor
    runs-on: ubuntu-slim
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The CLI rather than zizmor-action, which shells out to docker and so cannot run here.
      - name: Set up uv
        if: github.repository_owner == 'ayushtkn'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false # a cache here is writable from pull_request runs of this workflow
      - name: Run Zizmor (annotations)
        if: github.repository_owner == 'ayushtkn' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx zizmor@${ZIZMOR_VERSION} --persona=regular --format=github -- .
      - name: Run Zizmor (SARIF)
        if: github.repository_owner == 'ayushtkn' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx zizmor@${ZIZMOR_VERSION} --persona=regular --format=sarif -- . > "${RUNNER_TEMP}/zizmor.sarif"
      - name: Upload SARIF file to GitHub Advanced Security
        if: github.repository_owner == 'ayushtkn' && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: ${{ runner.temp }}/zizmor.sarif
          category: zizmor

  codeql:
    name: CodeQL Analyze
    if: github.repository_owner == 'ayushtkn'
    runs-on: ubuntu-slim
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: actions

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:actions"
